[workspace]
resolver = "2"
members = ["crates/typevn-core", "crates/ibus-typevn"]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "MIT"
authors = ["vithanhlam"]

[profile.release]
lto = true
codegen-units = 1
